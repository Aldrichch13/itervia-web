<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Plantilla de las páginas de plan: scripts/planes.py la copia a /plan/<ocasión>/<slug>/ con el <head> de cada plan.
       Sola sirve como /plan/ruta/?p=<slug> para un plan nuevo que aún no tiene página. -->
  <title>Un plan en Itervia</title>
  <meta name="description" content="Un plan con sus paradas en orden: dónde empezar, a dónde seguir y cómo rematar. Míralo en Itervia.">
  <meta name="apple-itunes-app" content="app-id=6758466804">
  <meta name="theme-color" content="#966B9D">
  <meta property="og:title" content="Un plan recomendado en Itervia">
  <meta property="og:description" content="Paradas en orden, con hora y cómo llegar.">
  <meta property="og:image" content="https://itervia.com.mx/assets/icon-512.png">
  <meta property="og:locale" content="es_MX">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap narrow">
      <a class="mark" href="/"><img src="/assets/logo.png" alt="" width="34" height="34">Itervia</a>
      <a class="btn btn-primary btn-small" href="/#descargar">Descargar</a>
    </div>
  </header>

  <main class="wrap narrow" style="padding-top:16px">
    <div id="demo-slot"></div>
    <div id="route" aria-live="polite"><div class="plan-cover skeleton"></div></div>
  </main>

  <footer>
    <div class="wrap narrow">
      <nav aria-label="Legal y ayuda">
        <a href="/">Inicio</a>
        <a href="/privacidad/">Aviso de privacidad</a>
        <a href="/soporte/">Soporte</a>
      </nav>
      <p>© 2026 Itervia · Hecho en la Ciudad de México</p>
    </div>
  </footer>

  <script type="module">
    import { renderRoute } from '/assets/ruta.js';
    renderRoute(document.getElementById('route'));
  </script>
</body>
</html>
