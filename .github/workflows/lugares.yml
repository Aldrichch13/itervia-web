# Una página por lugar y por plan para que la vista previa del enlace lleve su foto
# (scripts/lugares.py y scripts/planes.py).
name: Páginas de lugares y planes

on:
  schedule:
    - cron: '17 * * * *' # cada hora
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lugar/index.html', 'plan/ruta/index.html', 'scripts/lugares.py', 'scripts/planes.py']

permissions:
  contents: write

concurrency:
  group: lugares
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lugares.py
      - run: python3 scripts/planes.py
      - name: Publicar cambios
        run: |
          git add -A lugar plan
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Páginas de lugares y planes al día"
          git push
